agents:
  commander:
    model: gpt-4.1
    interval: 15m
    temperature: 0.2
    fallback_models: [deepseek-v4-pro, gpt-4.1-mini]
  supervisor:
    model: gpt-4.1-mini
    interval: 15m
    temperature: 0.0
    fallback_models: [deepseek-v4-flash, gemini-2.5-flash]
  treasurer:
    model: gpt-4.1
    interval: 15m
    temperature: 0.1
    fallback_models: [gpt-4.1-mini, claude-sonnet-4-5]
  coach:
    model: gpt-4.1
    cron: "0 0 * * *"
    temperature: 0.3
    fallback_models: [claude-sonnet-4-5, gpt-4.1-mini]
  sales:
    model: deepseek-v4-pro
    interval: 30m
    temperature: 0.5
    fallback_models: [deepseek-v4-flash, gpt-4.1-mini]
