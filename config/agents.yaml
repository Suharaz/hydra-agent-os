agents:
  commander:
    model: claude-fable-5-1
    interval: 5m
    temperature: 0.2
    fallback_models: [gpt-5.6-sol, claude-sonnet-4-5]
  supervisor:
    model: deepseek-v4-pro
    interval: 1m
    temperature: 0.0
    fallback_models: [deepseek-v4-flash, gpt-5-mini]
  treasurer:
    model: gpt-4.1
    interval: 15m
    temperature: 0.1
    fallback_models: [gpt-4.1-mini, claude-sonnet-4-5]
  coach:
    model: gpt-6-astra
    cron: "0 0 * * *"
    temperature: 0.4
    fallback_models: [claude-opus-4-5]
  sales:
    model: deepseek-v4-pro
    interval: 30m
    temperature: 0.5
    fallback_models: [deepseek-v4-flash, gpt-4.1-mini]
