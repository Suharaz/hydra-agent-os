# Engine configuration. Hot-reloaded (<= 200 ms) by the EngineRegistry; written by Commander/Coach
# inside the bounds exported from src/hot/engines/engine.ts (ENGINE_PARAM_BOUNDS).
# symbols must be a subset of risk.yaml.allowed_symbols[venue] (liqfade/basis: futures, convert/cexdex:
# spot, smmirror/tokstock: dex); an engine whose symbols are outside is rejected and keeps its previous
# config. paper -> live promotion is human-only in live. sizeUsd is per intent (notional).
engines:
  liqfade:
    enabled: true
    paper: false
    symbols: [ ETHUSDT, BTCUSDT ]
    sizeUsd: 4000
    params:
      windowMs: 3000 # 1000-5000  cascade window for consecutive forceOrder samples
      minSnapshots: 2 # 2-5        same-side samples inside the window
      minSampleUsd: 200000 # 5e4-1e6    each sample's notional
      minGapBps: 8 # 2-30       |mark - index| in the cascade direction
      minBurstRatio: 3 # 1-10       one-sided taker USD 1 s / (ADV / 86400)
      minDispBps: 40 # 10-100     price displacement vs 1-min VWAP
      tpBps: 35 # 10-100
      slBps: 25 # 10-100
      maxHoldMs: 120000 # 3e4-3e5    time stop
      chaseMs: 400 # 100-2000   LIMIT ttl before the executor gives up
      allowMarket: true #            MARKET when the book is not usable for a LIMIT
  basis:
    enabled: true
    paper: true
    symbols: [ BTCUSDT, ETHUSDT ]
    sizeUsd: 4000
    params:
      lookbackSec: 300 # 60-900     z-score window (1 s samples)
      zEntry: 2 # 1-4
      zExit: 0.5 # 0-1
      maxHoldMs: 120000 # 3e4-3e5
  convert:
    enabled: false
    paper: true
    symbols: []
    sizeUsd: 100
    params:
      minEdgeBps: 20 # 5-100
      pollMs: 5000 # 1000-60000
  smmirror:
    enabled: false
    paper: true
    symbols: []
    sizeUsd: 100
    params:
      minScore: 80 # 50-100     leaderboard score of the source wallet
      slipBps: 10 # 0-50       spot LIMIT above the ask
      tpBps: 40 # 10-100
      slBps: 30 # 10-100
      exitOnSellPct: 40 # 10-100     close when the source wallet sells this share of its entry
      maxTokenAgeSec: 3600 # 60-86400   ignore tracker events older than this
  cexdex:
    enabled: false
    paper: true
    symbols: []
    sizeUsd: 100
    params:
      minEdgeBps: 25 # 5-100      net of 10 bps fees + gas + DEX half-spread
  tokstock:
    enabled: false
    paper: true
    symbols: []
    sizeUsd: 100
    params:
      devBps: 60 # 20-200     token vs reference deviation
  swing:
    enabled: true
    paper: false
    symbols: [ BTCUSDT, ETHUSDT ]
    sizeUsd: 4000
    params:
      mode: 2
      timeframeSec: 900
      lookbackCandles: 8
      fastEma: 20
      slowEma: 50
      rsiThreshold: 30
      slAtr: 1.5
      tpAtr: 3.0
      maxHoldMs: 7200000
